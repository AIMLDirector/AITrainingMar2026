[project]
name = "infraprod"
version = "0.1.0"
description = "infraprod using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.11.0"
]

[project.scripts]
infraprod = "infraprod.main:run"
run_crew = "infraprod.main:run"
train = "infraprod.main:train"
replay = "infraprod.main:replay"
test = "infraprod.main:test"
run_with_trigger = "infraprod.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
